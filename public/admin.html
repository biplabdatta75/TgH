<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f4ef"><title>Store admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><div id="adminLogin" class="login-screen"><a class="wordmark" href="/">TgH</a><div class="login-card"><p class="eyebrow">STORE MANAGEMENT</p><h1>Welcome back.</h1><p>Sign in to manage your storefront and orders.</p><form id="loginForm"><label>Admin password<input type="password" id="adminPassword" autocomplete="current-password" required autofocus></label><button class="button button-dark full-width" type="submit">Sign in</button><p class="form-message" id="loginMessage"></p></form><a href="/" class="text-link">← Return to storefront</a></div><p class="login-help">First run? Find your generated password in <code>data/admin-password.txt</code>.</p></div>
